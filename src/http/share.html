<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ecece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242725" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="paperjam">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{og_description}}">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/golos-text-latin-400-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/golos-text-latin-600-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/golos-text-cyrillic-400-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/golos-text-cyrillic-600-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geologica-latin-600-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geologica-cyrillic-600-normal.woff2">
<title>{{title}}</title>
<style>{{style}}</style>
</head>
<body>
<header class="bar">
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/></svg>
    <span>paperjam</span>
  </span>
  <span class="expiry">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>{{expiry}}</span>
  </span>
</header>
<div class="layout">
  <main class="card" aria-labelledby="doc-title">
    <p class="eyebrow">{{shared_by}}</p>
    <h1 id="doc-title">{{title}}</h1>
    {{meta}}
    <a class="download" href="{{download_url}}" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
      <span>{{download_label}}</span>
      <small>{{download_size}}</small>
    </a>
    {{details}}
  </main>
  <section class="pages" aria-label="{{pages_label}}">
    {{pages}}
  </section>
</div>
<footer class="foot">{{footer}}</footer>
</body>
</html>
