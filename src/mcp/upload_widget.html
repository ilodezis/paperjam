<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Upload a scan</title>
<style>
  /* The app's own faces, served under fixed names. A host that does not honor the
     declared font origin falls back to the system font below. */
  @font-face { font-family: "Golos Text"; font-weight: 400; font-display: swap;
    src: url("__BASE__/fonts/golos-text-latin-400-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Golos Text"; font-weight: 400; font-display: swap;
    src: url("__BASE__/fonts/golos-text-cyrillic-400-normal.woff2") format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Golos Text"; font-weight: 600; font-display: swap;
    src: url("__BASE__/fonts/golos-text-latin-600-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Golos Text"; font-weight: 600; font-display: swap;
    src: url("__BASE__/fonts/golos-text-cyrillic-600-normal.woff2") format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }

  /* The web app's tokens, light and dark. */
  :root {
    --paper: #f6f5f1; --raised: #fbfaf7; --ink: #292c28; --muted: #5c6058;
    --line: #d9dad2; --line-strong: #bdc1b7; --accent: #315e4c; --accent-hover: #254a3c;
    --accent-soft: #e2e9e2; --on-accent: #f7faf7; --danger: #a34338; --focus: #a86d28;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #292c2a; --raised: #323633; --ink: #e6e7e0; --muted: #b0b5ac;
      --line: #454a45; --line-strong: #60675f; --accent: #9bbcac; --accent-hover: #b3cebf;
      --accent-soft: #37463e; --on-accent: #20352b; --danger: #eba397; --focus: #d5a25f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #292c2a; --raised: #323633; --ink: #e6e7e0; --muted: #b0b5ac;
    --line: #454a45; --line-strong: #60675f; --accent: #9bbcac; --accent-hover: #b3cebf;
    --accent-soft: #37463e; --on-accent: #20352b; --danger: #eba397; --focus: #d5a25f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 400 14px/1.4 "Golos Text", "Geologica", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); padding: 2px; -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin: 0 0 10px 2px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; flex: none; }
  .drop {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 24px 18px; background: var(--raised); border: 1px dashed var(--line-strong);
    border-radius: 9px; transition: background-color .15s ease, border-color .15s ease;
  }
  .drop.over { background: var(--accent-soft); border-color: var(--accent); }
  .drop > svg { width: 30px; height: 30px; margin-bottom: 12px; color: var(--accent); stroke-width: 1.7; }
  .title { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .hint { margin: 5px 0 16px; color: var(--muted); font-size: 13px; }
  button.pick {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 7px 22px;
    font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  button.pick:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.pick:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  label.local { display: flex; gap: 10px; align-items: center; margin-top: 16px; color: var(--muted); font-size: 13px; text-align: left; cursor: pointer; }
  label.local input {
    appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 0;
    border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--paper); cursor: pointer;
    display: grid; place-content: center;
  }
  label.local input:checked { background: var(--accent); border-color: var(--accent); }
  label.local input:checked::after {
    content: ""; width: 4px; height: 9px; margin-top: -2px;
    border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .name { overflow-wrap: anywhere; font-weight: 500; }
  .state { white-space: nowrap; color: var(--muted); font-size: 13px; }
  .state.ok { color: var(--accent); font-weight: 600; } .state.bad { color: var(--danger); font-weight: 600; }
  .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .bar.busy > i { width: 40% !important; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
  .msg { margin: 6px 0 0; font-size: 13px; color: var(--danger); overflow-wrap: anywhere; }
</style>
</head>
<body>
<p class="brand">
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#315e4c"/><path d="M8 7h10l6 6v12c0 .6-.4 1-1 1H9c-.6 0-1-.4-1-1z" fill="#fbfaf7"/><path d="M18 7v5c0 .6.4 1 1 1h5z" fill="#bdc1b7"/><rect x="11" y="14" width="6" height="2" rx=".5" fill="#315e4c"/><rect x="11" y="18" width="10" height="1.5" rx=".5" fill="#8e958b"/><rect x="11" y="21" width="8" height="1.5" rx=".5" fill="#8e958b"/></svg>
  paperjam
</p>
<div class="drop" id="drop">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
  <p class="title" id="title"></p>
  <p class="hint" id="hint"></p>
  <button class="pick" id="pick" type="button"></button>
  <label class="local"><input type="checkbox" id="local"> <span id="localText"></span></label>
  <input type="file" id="file" multiple hidden
         accept="application/pdf,image/jpeg,image/png,image/webp,image/tiff,image/heic,image/heif,text/plain,.pdf,.jpg,.jpeg,.png,.webp,.tif,.tiff,.heic,.txt">
</div>
<ul id="list"></ul>
<script>
(() => {
  const MAX_VIA_TOOL = 10 * 1024 * 1024; // upload_document takes at most 10 MB
  // The chat language wins over the browser's: the host reports it in its context.
  let ru = /^ru/i.test(navigator.language);
  const RU = {
    title: "Загрузить документы", pick: "Выбрать скан", hint: "PDF, JPEG, PNG, WebP, TIFF, HEIC или текст. Можно сразу несколько.",
    local: "Не отправлять в LLM (только локальная обработка)", sending: "Загрузка…", done: "Загружено",
    dup: "Уже есть в архиве", bad: "Не удалось", type: "Этот тип файла не поддерживается",
    link: "Не получилось получить ссылку для загрузки", net: "Нет связи с архивом",
    big: "Файл больше 10 МБ, а прямая загрузка отсюда недоступна", sent: "Загружено в архив: ",
  };
  const EN = {
    title: "Upload documents", pick: "Choose a scan", hint: "PDF, JPEG, PNG, WebP, TIFF, HEIC or text. Several at once is fine.",
    local: "Keep away from the LLM (local processing only)", sending: "Uploading…", done: "Uploaded",
    dup: "Already in the archive", bad: "Failed", type: "This file type is not supported",
    link: "Could not get an upload link", net: "Cannot reach the archive",
    big: "The file is over 10 MB and direct upload is not available here", sent: "Uploaded to the archive: ",
  };
  let T = ru ? RU : EN;
  const $ = (id) => document.getElementById(id);
  function applyLanguage(isRu) {
    ru = isRu; T = ru ? RU : EN; document.documentElement.lang = ru ? "ru" : "en";
    $("title").textContent = T.title; $("pick").textContent = T.pick; $("hint").textContent = T.hint; $("localText").textContent = T.local;
  }
  applyLanguage(ru);

  // --- the host: JSON-RPC over postMessage (MCP Apps) ---------------------------------
  let nextId = 1; const pending = new Map(); let firstLink = null;
  const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && !m.method) {
      const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || "error")) : p.resolve(m.result);
    } else if (m.method === "ui/notifications/tool-result") {
      const link = m.params && m.params.structuredContent;
      if (link && link.url) firstLink = link;
    } else if (m.id !== undefined && (m.method === "ping" || m.method === "ui/resource-teardown")) {
      post({ id: m.id, result: {} });
    }
  });
  request("ui/initialize", {
    appInfo: { name: "paperjam-upload", version: "1.0.0" }, appCapabilities: {}, protocolVersion: "2026-01-26",
  }).then((result) => {
    const ctx = (result && result.hostContext) || {};
    if (typeof ctx.locale === "string") applyLanguage(/^ru/i.test(ctx.locale));
    if (ctx.theme === "light" || ctx.theme === "dark") document.documentElement.dataset.theme = ctx.theme;
    notify("ui/notifications/initialized", {});
  }).catch(() => {});
  new ResizeObserver(() => notify("ui/notifications/size-changed", {
    width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight),
  })).observe(document.body);

  // --- way 1: straight to a one-time link ---------------------------------------------
  async function takeLink() {
    if (firstLink && Date.parse(firstLink.expires_at) - Date.now() > 20000) {
      const link = firstLink; firstLink = null; return link.url;
    }
    firstLink = null;
    const result = await request("tools/call", { name: "create_upload_link", arguments: {} });
    const link = result && result.structuredContent;
    if (!link || !link.url) throw new Error(T.link);
    return link.url;
  }
  class Unreachable extends Error {}
  function put(url, file, localOnly, onProgress) {
    return new Promise((resolve, reject) => {
      const q = new URLSearchParams({ filename: file.name });
      if (localOnly) q.set("local_only", "true");
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", url + "?" + q);
      xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
      xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
      // No answer at all: the frame's CSP or the network stopped it.
      xhr.onerror = () => reject(new Unreachable(T.net));
      xhr.onload = () => {
        let body = {}; try { body = JSON.parse(xhr.responseText); } catch (_) {}
        resolve({ status: xhr.status, body });
      };
      xhr.send(file);
    });
  }

  // --- way 2: through the host, as a tool call. The chat model never sees these bytes. --
  const toBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(T.bad));
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.readAsDataURL(file);
  });
  async function viaTool(file, localOnly) {
    if (file.size > MAX_VIA_TOOL) return { status: 413, body: { message: T.big } };
    const args = { filename: file.name, content_base64: await toBase64(file) };
    if (localOnly) args.local_only = true;
    const result = await request("tools/call", { name: "upload_document", arguments: args });
    if (!result || !result.isError) {
      const id = result && result.structuredContent && result.structuredContent.id;
      return { status: 201, body: { id } };
    }
    let err = {};
    try { err = JSON.parse(result.content[0].text).error || {}; } catch (_) {}
    const status = err.code === "duplicate" ? 409 : err.code === "unsupported_type" ? 422 : 400;
    return { status, body: { message: err.message, code: err.code } };
  }

  let directBlocked = false; // once the direct way fails, the next files skip it

  function addRow(file) {
    const li = document.createElement("li");
    li.innerHTML = '<div class="row"><span class="name"></span><span class="state"></span></div><div class="bar"><i></i></div><p class="msg" hidden></p>';
    li.querySelector(".name").textContent = file.name;
    $("list").appendChild(li);
    const state = li.querySelector(".state"), barBox = li.querySelector(".bar"), bar = li.querySelector("i"), msg = li.querySelector(".msg");
    return {
      progress: (f) => { state.textContent = T.sending; barBox.classList.remove("busy"); bar.style.width = Math.round(f * 100) + "%"; },
      busy: () => { state.textContent = T.sending; barBox.classList.add("busy"); },
      finish: (cls, text, detail) => {
        barBox.classList.remove("busy");
        state.className = "state " + cls; state.textContent = text;
        bar.style.width = cls === "ok" ? "100%" : "0";
        if (detail) { msg.hidden = false; msg.textContent = detail; }
      },
    };
  }

  async function sendOne(file, localOnly, row) {
    if (!directBlocked) {
      try {
        for (let attempt = 0; attempt < 2; attempt++) {
          const reply = await put(await takeLink(), file, localOnly, row.progress);
          if (reply.status !== 401 || attempt === 1) return reply; // 401: the link expired, take a fresh one
        }
      } catch (e) {
        if (!(e instanceof Unreachable)) throw e;
        directBlocked = true;
      }
    }
    row.busy();
    return viaTool(file, localOnly);
  }

  async function uploadOne(file, localOnly) {
    const row = addRow(file); row.progress(0);
    try {
      const { status, body } = await sendOne(file, localOnly, row);
      if (status === 201) { row.finish("ok", T.done); return { ok: true, name: file.name, id: body.id }; }
      if (status === 409) { row.finish("bad", T.dup); return { ok: false }; }
      if (status === 422) { row.finish("bad", T.bad, body.message || T.type); return { ok: false }; }
      row.finish("bad", T.bad, body.message || ("HTTP " + status));
    } catch (e) {
      row.finish("bad", T.bad, e.message);
    }
    return { ok: false };
  }

  async function uploadAll(files) {
    $("pick").disabled = true;
    const localOnly = $("local").checked, done = [];
    for (const file of files) { const r = await uploadOne(file, localOnly); if (r.ok) done.push(r); }
    $("pick").disabled = false;
    if (done.length) {
      const text = T.sent + done.map((d) => d.name + " (" + d.id + ")").join(", ");
      request("ui/message", { role: "user", content: { type: "text", text } }).catch(() => {});
    }
  }

  const input = $("file");
  $("pick").addEventListener("click", () => input.click());
  input.addEventListener("change", () => { const f = [...input.files]; input.value = ""; if (f.length) uploadAll(f); });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { const f = [...(e.dataTransfer?.files || [])]; if (f.length) uploadAll(f); });
})();
</script>
</body>
</html>
