name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "landing/**"]
  pull_request:
    paths-ignore: ["**.md", "landing/**"]
  workflow_dispatch:

# A newer push to the same PR supersedes the older run; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt and deny are seconds of work each, but every job bills at least a minute.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: ${{ !cancelled() }}
        with:
          command: check advisories licenses bans sources

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev
      - run: cargo clippy --workspace --all-targets --features paperjam/heic -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The OS of the container image, so Tesseract and libheif match what ships.
    container: rust:1.99-trixie
    env:
      # Dozens of test binaries with full debuginfo crash the linker (bus error)
      # on a runner's disk and memory.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >
          apt-get update && apt-get install -y --no-install-recommends
          pkg-config libheif-dev libheif-plugin-libde265
          tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd tesseract-ocr-rus tesseract-ocr-ron
      - run: cargo xtask fixtures
      - run: cargo test --workspace --features paperjam/heic

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo xtask i18n-check
