<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#366552" />
      <stop offset="100%" stop-color="#264b3c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Background document (stacked behind) -->
  <g transform="translate(160, 100) rotate(7)">
    <rect width="180" height="240" rx="12" fill="#203d31" opacity="0.6" />
    <rect width="180" height="240" rx="12" fill="#e2e9e2" opacity="0.25" />
  </g>

  <!-- Main front document with folded corner -->
  <g filter="url(#shadow)">
    <!-- Main page body -->
    <path d="M 136 120
             L 300 120
             L 376 196
             L 376 392
             C 376 400.8 368.8 408 360 408
             L 152 408
             C 143.2 408 136 400.8 136 392
             Z"
          fill="#fbfaf7" />

    <!-- Folded corner tab -->
    <path d="M 300 120
             L 300 184
             C 300 190.6 305.4 196 312 196
             L 376 196
             Z"
          fill="#dcded7" />

    <!-- Document structure lines -->
    <rect x="176" y="196" width="96" height="14" rx="4" fill="#315e4c" />
    <rect x="176" y="234" width="160" height="10" rx="3" fill="#8e958b" />
    <rect x="176" y="260" width="160" height="10" rx="3" fill="#8e958b" />
    <rect x="176" y="286" width="128" height="10" rx="3" fill="#8e958b" />

    <!-- Document stamp/badge motif -->
    <circle cx="316" cy="344" r="22" fill="#e2e9e2" />
    <circle cx="316" cy="344" r="16" fill="none" stroke="#315e4c" stroke-width="3" stroke-dasharray="4 2" />
    <path d="M 310 344 L 314 348 L 324 338" fill="none" stroke="#315e4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
